name: Quality checks

on:
  push:
  pull_request:

jobs:
  lint-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MCP_URL: https://lex.xlap.pl/mcp
      CF_ACCESS_CLIENT_ID: E2E_TEST_ONLY
      CF_ACCESS_CLIENT_SECRET: E2E_TEST_ONLY
      APP_ORIGIN: https://explorer.xlap.pl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.3
      - name: Ruff lint and format
        run: |
          ruff check --no-cache .
          ruff format --check .
      - name: Python integration test server
        run: |
          PORT=8080 E2E_ORIGIN=http://127.0.0.1:8080 python tests/e2e_server.py &
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
      - name: Python unit and transport tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Install browser test runner
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E fixture
        run: |
          PORT=8090 E2E_ORIGIN=http://127.0.0.1:8090 python tests/e2e_server.py &
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:8090/healthz && break; sleep 1; done
      - name: Run Playwright browser E2E
        run: npm run test:e2e:ci
        env:
          E2E_BASE_URL: http://127.0.0.1:8090
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results
          retention-days: 3
