[project]
name = "explorer-mcp"
version = "0.1.0"
description = "Lightweight Cloudflare MCP Portal explorer"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff==0.17.3"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".venv", "node_modules", "test-results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S105", "S106"]
"tests/*.py" = ["S105", "S106"]
